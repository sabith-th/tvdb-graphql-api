name: Build for Dependabot
on:
  push:
    branches-ignore:
      - main
permissions:
  contents: read
jobs:
  Deploy-Preview:
    runs-on: ubuntu-latest
    environment: Preview
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Project Dependencies
        run: pnpm install
      - name: Build Project
        run: pnpm run build
